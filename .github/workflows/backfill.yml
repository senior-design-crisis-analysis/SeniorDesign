name: Daily Backfill Debug

on:
  workflow_dispatch:

jobs:
  backfill:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: List all files to see structure
      run: find . -name "*.ts" -type f | head -20
    
    - name: Check if backfill exists
      run: |
        echo "Looking for backfill.ts..."
        find . -name "backfill.ts" -type f
        echo "Checking src/bluesky_scripts directory..."
        ls -la src/bluesky_scripts/ || echo "Directory not found"
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
    
    - name: Install dependencies
      run: npm install
    
    - name: Try to run backfill
      run: npx tsx src/bluesky_scripts/backfill.ts
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY:  ${{ secrets.SUPABASE_SERIVE_ROLE_KEY }}
        BLUESKY_USERNAME: ${{ secrets.BLUESKY_USERNAME }}
        BLUESKY_PASSWORD: ${{ secrets.BLUESKY_PASSWORD }}
        
