name: Daily Backfill

on:
  schedule:
    - cron: '0 8 * * *'  # 8:00 AM UTC
    - cron: '0 20 * * *' # 8:00 PM UTC
  workflow_dispatch:

jobs:
  backfill:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Debug secrets before running
        run: |
          echo "SUPABASE_URL is ${SUPABASE_URL:+SET}"
          echo "SUPABASE_SERVICE_ROLE_KEY is ${SUPABASE_SERVICE_ROLE_KEY:+SET}"
          echo "BLUESKY_USERNAME is ${BLUESKY_USERNAME:+SET}"
          echo "BLUESKY_PASSWORD is ${BLUESKY_PASSWORD:+SET}"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BLUESKY_USERNAME: ${{ secrets.BLUESKY_USERNAME }}
          BLUESKY_PASSWORD: ${{ secrets.BLUESKY_PASSWORD }}

      - name: Run backfill script (no dotenv)
        run: |
          node -e "
            console.log('Runtime check:')
            console.log('SUPABASE_URL:', process.env.SUPABASE_URL)
            console.log('SUPABASE_SERVICE_ROLE_KEY:', process.env.SUPABASE_SERVICE_ROLE_KEY ? 'SET' : 'NOT SET')
            console.log('BLUESKY_USERNAME:', process.env.BLUESKY_USERNAME ? 'SET' : 'NOT SET')
          "
          npx tsx src/bluesky_scripts/backfill.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BLUESKY_USERNAME: ${{ secrets.BLUESKY_USERNAME }}
          BLUESKY_PASSWORD: ${{ secrets.BLUESKY_PASSWORD }}

