name: Daily Backfill

on:
  workflow_dispatch:

jobs:
  backfill:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: List files to see structure
      run: ls -la
    
    - name: Check if backfill script exists
      run: ls -la scripts/
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
    
    - name: Install dependencies
      run: npm install
    
    - name: Check package.json for tsx
      run: cat package.json | grep tsx
    
    - name: Try to run backfill
      run: npx tsx scripts/backfill.ts
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY:  ${{ secrets.SUPABASE_SERIVE_ROLE_KEY }}
        BLUESKY_USERNAME: ${{ secrets.BLUESKY_USERNAME }}
        BLUESKY_PASSWORD: ${{ secrets.BLUESKY_PASSWORD }}
        
