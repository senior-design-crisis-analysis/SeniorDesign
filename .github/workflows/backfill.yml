name: Daily Backfill

on:
  schedule:
    - cron: '0 8 * * *'  # 8:00 AM UTC
    - cron: '0 20 * * *' # 8:00 PM UTC
  workflow_dispatch:

jobs:
  backfill:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm install
    
    - name: Run backfill script
      run: npx tsx src/bluesky_scripts/backfill.ts
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}  # Exact name 
        BLUESKY_USERNAME: ${{ secrets.BLUESKY_USERNAME }}
        BLUESKY_PASSWORD: ${{ secrets.BLUESKY_PASSWORD }}
        NODE_ENV: production  # might suppress dotenv warnings
