name: Run Backfill

on:
  workflow_dispatch:

jobs:
  backfill:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run backfill script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_OR_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_OR_ANON_KEY }}
          BLUESKY_USERNAME: ${{ secrets.BLUESKY_USERNAME }}
          BLUESKY_PASSWORD: ${{ secrets.BLUESKY_PASSWORD }}
          NODE_ENV: production
        run: |
          echo "🔍 Checking env variables..."
          env | grep SUPABASE || true
          echo "✅ Launching script..."
          node -e "console.log('SUPABASE_URL:', !!process.env.SUPABASE_URL, 'SUPABASE_KEY:', !!process.env.SUPABASE_SERVICE_ROLE_KEY)"
          npx tsx --no-warnings src/bluesky_scripts/backfill.ts
