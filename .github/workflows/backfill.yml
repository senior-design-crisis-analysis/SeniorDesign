name: Daily Backfill

on:
  schedule:
    - cron: '0 8 * * *'  # 8:00 AM UTC
    - cron: '0 20 * * *' # 8:00 PM UTC
  workflow_dispatch:

jobs:
  backfill:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm install
    
    - name: Debug environment variables
      run: |
        echo "Checking env vars before running script:"
        node -e "
        console.log('SUPABASE_URL:', process.env.SUPABASE_URL ? 'SET' : 'NOT SET');
        console.log('SUPABASE_KEY:', process.env.SUPABASE_KEY ? 'SET' : 'NOT SET');
        console.log('SUPABASE_SERVICE_ROLE_KEY:', process.env.SUPABASE_SERVICE_ROLE_KEY ? 'SET' : 'NOT SET');
        "
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        BLUESKY_USERNAME: ${{ secrets.BLUESKY_USERNAME }}
        BLUESKY_PASSWORD: ${{ secrets.BLUESKY_PASSWORD }}
    
    - name: Run backfill script
      run: |
        # Set the variables explicitly for the script
        export SUPABASE_URL="${{ secrets.SUPABASE_URL }}"
        export SUPABASE_KEY="${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"
        export BLUESKY_USERNAME="${{ secrets.BLUESKY_USERNAME }}"
        export BLUESKY_PASSWORD="${{ secrets.BLUESKY_PASSWORD }}"
        npx tsx src/bluesky_scripts/backfill.ts
