name: Daily Backfill

on:
  schedule:
    - cron: '0 8 * * *'  # 8:00 AM UTC
    - cron: '0 20 * * *' # 8:00 PM UTC
  workflow_dispatch:

jobs:
  backfill:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Create .env file in workspace
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > $GITHUB_WORKSPACE/.env
          echo "SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" >> $GITHUB_WORKSPACE/.env
          echo "BLUESKY_USERNAME=${{ secrets.BLUESKY_USERNAME }}" >> $GITHUB_WORKSPACE/.env
          echo "BLUESKY_PASSWORD=${{ secrets.BLUESKY_PASSWORD }}" >> $GITHUB_WORKSPACE/.env
          echo ".env created at: $GITHUB_WORKSPACE/.env"
          ls -l $GITHUB_WORKSPACE/.env

      - name: Debug .env location and content
        run: |
          echo "Current directory:"
          pwd
          echo "List files:"
          ls -la
          echo "Preview .env file (without secrets):"
          cat .env | sed 's/=.*/=[REDACTED]/'

      - name: Run backfill script
        working-directory: ${{ github.workspace }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BLUESKY_USERNAME: ${{ secrets.BLUESKY_USERNAME }}
          BLUESKY_PASSWORD: ${{ secrets.BLUESKY_PASSWORD }}
        run: |
          echo "Environment check before running script:"
          node -e "
            console.log('SUPABASE_URL:', process.env.SUPABASE_URL ? 'SET' : 'NOT SET');
            console.log('SUPABASE_SERVICE_ROLE_KEY:', process.env.SUPABASE_SERVICE_ROLE_KEY ? 'SET' : 'NOT SET');
            console.log('BLUESKY_USERNAME:', process.env.BLUESKY_USERNAME ? 'SET' : 'NOT SET');
          "
          echo "Running backfill..."
          npx tsx src/bluesky_scripts/backfill.ts
