name: Run Both Firehose

on:
  schedule:
    - cron: '0 15 * * *' # 9am Central (15:00 UTC)
  workflow_dispatch:

# Reusable config for both jobs
env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  BLUESKY_USERNAME: ${{ secrets.BLUESKY_USERNAME }}
  BLUESKY_PASSWORD: ${{ secrets.BLUESKY_PASSWORD }}
  NODE_ENV: production

jobs:
  firehose-keywords:
    name: Run Firehose (Keywords)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Debug file existence
        run: |
          echo "Checking for firehose_keywords.ts..."
          ls -R src/bluesky_scripts || echo "Directory missing!"

      - name: Run Firehose (Keywords)
        run: npx tsx src/bluesky_scripts/firehose_keywords.ts

  firehose-accounts:
    name: Run Firehose (Accounts)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Debug file existence
        run: |
          echo "Checking for firehose_accounts.ts..."
          ls -R src/bluesky_scripts || echo "Directory missing!"

      - name: Run Firehose (Accounts)
        run: npx tsx src/bluesky_scripts/firehose_accounts.ts
