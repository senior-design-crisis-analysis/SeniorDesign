name: Run Firehose Daily

on:
  schedule:
    # Run every day at 9 AM Central Time (15:00 UTC)
    - cron: '0 15 * * *'
  workflow_dispatch: # allows manual trigger too

jobs:
  run-firehose:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci  # or npm install if you don't have a package-lock.json

      - name: Run Firehose
        run: npx tsx src/bluesky_scripts/firehose.ts
